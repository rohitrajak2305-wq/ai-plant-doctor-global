<!-- SABKO DIKHEGA -->
<div>
  <h3>Deposit Offer (Demo)</h3>
  <img id="mainOfferImg" src="" style="width:100%; max-width:300px; display:none; border-radius:10px">
  <p id="noImgText" style="color:gray; font-size:12px">Abhi koi offer image nahi hai</p>
</div>

<!-- SIRF TU DEKHEGA - Admin Box -->
<div style="margin-top:20px; background:#f5f5f5; padding:10px; border-radius:8px">
  <input type="password" id="adminPass" placeholder="Admin password">
  <button onclick="adminLogin()">Login</button>

  <div id="uploadArea" style="display:none; margin-top:10px">
    <p><b>Sirf Admin:</b> Image dalo</p>
    <input type="file" id="adminImg" accept="image/*" onchange="adminUpload(event)">
    <button onclick="removeImg()" style="margin-left:10px; color:red">Image Hatao</button>
  </div>
</div>

<script>
let isAdmin = false;
function adminLogin(){
  if(document.getElementById('adminPass').value === "admin123"){
    isAdmin = true;
    document.getElementById('uploadArea').style.display = "block";
    alert("Login ho gaya - ab sirf tu image daal sakta hai");
  } else { alert("Galat password"); }
}

function adminUpload(e){
  if(!isAdmin) return;
  let file = e.target.files[0];
  let reader = new FileReader();
  reader.onload = function(){
    let base64 = reader.result;
    localStorage.setItem('offerImg', base64);
    showImg(base64);
  }
  reader.readAsDataURL(file);
}

function showImg(src){
  document.getElementById('mainOfferImg').src = src;
  document.getElementById('mainOfferImg').style.display = "block";
  document.getElementById('noImgText').style.display = "none";
}

function removeImg(){
  if(!isAdmin) return;
  localStorage.removeItem('offerImg');
  document.getElementById('mainOfferImg').style.display = "none";
  document.getElementById('noImgText').style.display = "block";
}

// Page khulte hi check karo image hai ya nahi
let saved = localStorage.getItem('offerImg');
if(saved) showImg(saved);
</script>
