function applyLang(l){const t=translations[l];document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.getAttribute("data-i18n");if(t[k])e.textContent=t[k]});document.querySelectorAll("[data-i18n-ph]").forEach(e=>{const k=e.getAttribute("data-i18n-ph");if(t[k])e.placeholder=t[k]});localStorage.setItem("pd_lang",l);checkPremium()}
document.getElementById('lang').onchange=e=>applyLang(e.target.value);
const saved=localStorage.getItem("pd_lang")||"hi";document.getElementById('lang').value=saved;applyLang(saved);
function showPage(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function isPremium(){return localStorage.getItem("plantDoctorIsPremium")==="true"}
function checkPremium(){const lang=document.getElementById('lang').value;document.getElementById('premiumStatus').textContent=isPremium()?(lang==="hi"?"✅ प्रीमियम एक्टिव":"✅ Premium Active"):(lang==="hi"?"❌ फ्री मोड":"❌ Free Mode")}
checkPremium();
document.getElementById('country').onchange=function(){const isUS=this.value==="US";const lang=document.getElementById('lang').value;document.getElementById('price').textContent=isUS?"$4.99 Lifetime":"₹100 Lifetime";document.getElementById('priceSub').textContent=isUS?(lang==="hi"?"USA के लिए":"For USA"):(lang==="hi"?"भारत के लिए":"For India");document.getElementById('indiaPay').style.display=isUS?"none":"block";document.getElementById('usaPay').style.display=isUS?"block":"none"};
let curUrl=null;document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(f);const img=document.getElementById('preview');img.src=curUrl;img.style.display='block'};

document.getElementById('verifyPay').onclick=()=>{const utr=document.getElementById('utr').value.trim();if(utr.length<2)return alert("ID daalo");localStorage.setItem("plantDoctorIsPremium","true");document.getElementById('payMsg').innerHTML="<div class='result'>✅ Premium Active!</div>";checkPremium()};
