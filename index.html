<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Doctor - REAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2faf5;color:#173b2a}
header{background:linear-gradient(135deg,#087443,#31b96f);color:#fff;padding:12px 6%;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10;gap:8px}
.header-right{display:flex;gap:6px}
select.lang, select.country{padding:8px;border:0;border-radius:8px;font-weight:bold}
.container{max-width:1050px;margin:auto;padding:20px 15px}
.card{background:#fff;padding:20px;border-radius:19px;box-shadow:0 6px 25px rgba(0,0,0,.07);margin-bottom:18px}
input,select{width:100%;padding:12px;border:1px solid #b9d6c3;border-radius:10px;margin:7px 0 14px}
.btn{border:0;background:#14834f;color:#fff;padding:12px;border-radius:11px;font-weight:bold;cursor:pointer;width:100%}
.result{background:#effaf2;border-left:5px solid #14834f;padding:15px;border-radius:10px;margin-top:15px}
.price{font-size:34px;font-weight:900}
#preview{width:100%;max-height:300px;object-fit:contain;display:none;margin:10px 0;border-radius:14px}
.nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:15px}
.nav button{border:0;padding:10px 14px;border-radius:12px;background:#dff3e6;font-weight:bold;cursor:pointer;white-space:nowrap}
.nav button.active{background:#14834f;color:#fff}
.page{display:none}.page.active{display:block}
.qr-box{background:#000;color:#fff;padding:20px;border-radius:20px;text-align:center}
.paypal-box{background:#f0f7ff;border:2px solid #0070ba;padding:20px;border-radius:20px;text-align:center}
</style>
</head>
<body>
<header>
<div>🌱 Plant Doctor</div>
<div class="header-right">
<select id="lang" class="lang"><option value="hi">हिन्दी 🇮🇳</option><option value="en">English 🇺🇸</option></select>
<select id="country" class="country"><option value="IN">India</option><option value="US">USA</option></select>
</div>
</header>
<div class="container">
<div class="nav">
<button class="active" data-page="check" onclick="showPage('check',this)" data-i18n="navCheck">📷 पौधा जाँच</button>
<button data-page="premium" onclick="showPage('premium',this)" data-i18n="navPremium">⭐ प्रीमियम</button>
<button data-page="owner" onclick="showPage('owner',this)" data-i18n="navOwner">👨‍💼 ओनर</button>
</div>

<section id="check" class="page active">
<div class="card">
<h2 data-i18n="checkTitle">📷 असली AI जाँच</h2>
<input id="photo" type="file" accept="image/*"><img id="preview">
<input id="plantName" data-i18n-ph="plantPlaceholder" placeholder="टमाटर, आलू आदि">
<select id="symptom">
<option value="" data-i18n="symptomSelect">लक्षण चुनें</option>
<option value="yellow" data-i18n="yellow">पत्ते पीले</option>
<option value="brown" data-i18n="brown">भूरे धब्बे</option>
<option value="white" data-i18n="white">सफेद पाउडर</option>
<option value="insects" data-i18n="insects">कीड़े</option>
<option value="wilt" data-i18n="wilt">मुरझाना</option>
</select>
<button class="btn" id="analyze" data-i18n="analyzeBtn">🔍 असली AI से चेक करो</button>
<div id="result"></div>
<p id="premiumStatus" style="font-size:13px; font-weight:bold; margin-top:10px"></p>
</div>
</section>

<section id="premium" class="page"><div class="card">
<h2 data-i18n="premiumTitle">⭐ प्रीमियम</h2><div class="price" id="price">₹100 Lifetime</div>
<p id="priceSub">भारत के लिए</p>

<div id="indiaPay" class="qr-box">
<h2 style="color:#9d6eff">PhonePe</h2>
<p style="color:#9d6eff;font-weight:bold">ACCEPTED HERE</p>
<p data-i18n="scanQr">PhonePe App से QR Scan करो</p>
<img src="phonepe-qr.jpg" style="width:240px; background:#fff; padding:12px; border-radius:15px; margin:10px 0" alt="PhonePe QR">
<p><b>ROHIT KUMAR</b></p>
</div>

<div id="usaPay" class="paypal-box" style="display:none">
<img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg" style="width:80px" alt="PayPal">
<h2>PayPal</h2>
<p data-i18n="usaPayText">USA Users - Click below to pay</p>
<a href="https://www.paypal.me/RohitKumar313807" target="_blank" style="text-decoration:none">
<div style="background:#0070ba;color:#fff;padding:15px;border-radius:12px;font-weight:bold;margin:15px 0" data-i18n="paypalBtn">💳 Pay $4.99 via PayPal</div>
</a>
<p style="font-size:12px">paypal.me/RohitKumar313807</p>
</div>

<div style="margin-top:20px">
<input id="utr" data-i18n-ph="utrPlaceholder" placeholder="Transaction ID डालो">
<button class="btn" id="verifyPay" style="background:#5f259f" data-i18n="paidBtn">✅ मैंने पेमेंट कर दिया</button>
<p id="payMsg"></p>
</div>
</div></section>

<section id="owner" class="page"><div class="card">
<h2 data-i18n="ownerTitle">👨‍💼 ओनर - सिर्फ तुम</h2>
<input id="ownerPinSet" type="password" placeholder="4 digit PIN set karo" maxlength="4">
<button class="btn" id="registerOwner" data-i18n="regOwner">🔐 ओनर रजिस्टर (Face ID)</button><br><br>
<input id="ownerPinLogin" type="password" placeholder="PIN डालो" maxlength="4">
<button class="btn" id="ownerLogin" data-i18n="ownerLogin">👤 ओनर लॉगिन</button>
<div id="ownerMessage" style="margin-top:10px"></div><div id="adminPanel"></div>
</div></section>
</div>

<script>
const translations={
en:{navCheck:"📷 Plant Check",navPremium:"⭐ Premium",navOwner:"👨‍💼 Owner",checkTitle:"📷 Real AI Check",plantPlaceholder:"Tomato, Potato etc",symptomSelect:"Select symptom",yellow:"Yellow leaves",brown:"Brown spots",white:"White powder",insects:"Insects",wilt:"Wilting",analyzeBtn:"🔍 Check with Real AI",premiumTitle:"⭐ Premium",scanQr:"Scan any QR using PhonePe App",usaPayText:"USA Users - Click below to pay",paypalBtn:"💳 Pay $4.99 via PayPal - Click Here",utrPlaceholder:"Enter Transaction ID",paidBtn:"✅ I Have Paid - Turn ON Premium",ownerTitle:"👨‍💼 Owner - Only You",regOwner:"🔐 Register Owner (Face ID)",ownerLogin:"👤 Owner Login"},
hi:{navCheck:"📷 पौधा जाँच",navPremium:"⭐ प्रीमियम",navOwner:"👨‍💼 ओनर",checkTitle:"📷 असली AI जाँच",plantPlaceholder:"टमाटर, आलू आदि",symptomSelect:"लक्षण चुनें",yellow:"पत्ते पीले",brown:"भूरे धब्बे",white:"सफेद पाउडर",insects:"कीड़े",wilt:"मुरझाना",analyzeBtn:"🔍 असली AI से चेक करो",premiumTitle:"⭐ प्रीमियम",scanQr:"PhonePe App से QR Scan करो",usaPayText:"USA यूजर्स - नीचे क्लिक करके पे करो",paypalBtn:"💳 PayPal से $4.99 Pay करो - क्लिक करो",utrPlaceholder:"Transaction ID डालो",paidBtn:"✅ मैंने पेमेंट कर दिया - प्रीमियम ON करो",ownerTitle:"👨‍💼 ओनर - सिर्फ तुम",regOwner:"🔐 ओनर रजिस्टर (Face ID)",ownerLogin:"👤 ओनर लॉगिन"}
};
const CONFIG={ PREMIUM_KEY:"plantDoctorIsPremium", PIN_KEY:"pdPin" };
function applyLanguage(lang){
const t=translations[lang];
document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(t[k]) el.textContent=t[k];});
document.querySelectorAll("[data-i18n-ph]").forEach(el=>{const k=el.getAttribute("data-i18n-ph"); if(t[k]) el.placeholder=t[k];});
localStorage.setItem("pd_lang",lang); checkPremium();
}
document.getElementById('lang').onchange=(e)=>applyLanguage(e.target.value);
const savedLang=localStorage.getItem("pd_lang")||"hi";
document.getElementById('lang').value=savedLang; applyLanguage(savedLang);

function showPage(id,btn){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
function isPremium(){ return localStorage.getItem(CONFIG.PREMIUM_KEY)==="true"; }
function checkPremium(){
const lang=document.getElementById('lang').value;
document.getElementById('premiumStatus').textContent = isPremium()? (lang==="hi"?"✅ प्रीमियम एक्टिव है":"✅ Premium Active") : (lang==="hi"?"❌ फ्री मोड - प्रीमियम लो":"❌ Free Mode - Get Premium");
}

document.getElementById('country').onchange=()=>{
const isUS=document.getElementById('country').value==="US";
const lang=document.getElementById('lang').value;
document.getElementById('price').textContent=isUS? "$4.99 Lifetime" : "₹100 Lifetime";
document.getElementById('priceSub').textContent=isUS? (lang==="hi"?"USA के लिए":"For USA") : (lang==="hi"?"भारत के लिए":"For India");
document.getElementById('indiaPay').style.display=isUS? "none" : "block";
document.getElementById('usaPay').style.display=isUS? "block" : "none";
document.getElementById('verifyPay').style.background=isUS? "#0070ba" : "#5f259f";
};

let curUrl=null;
document.getElementById('photo').onchange=(e)=>{
const f=e.target.files[0]; if(!f) return;
if(curUrl) URL.revokeObjectURL(curUrl);
curUrl=URL.createObjectURL(f);
const img=document.getElementById('preview'); img.src=curUrl; img.style.display='block';
};
async function realAI(file){
try{
const res=await fetch("https://api-inference.huggingface.co/models/linkanjarad/mobilenet_v2_1.0_224-plant-disease-identification", {method:"POST", body: file});
const data=await res.json();
if(Array.isArray(data) && data.length>0) return `✅ REAL AI: ${data[0].label} - ${(data[0].score*100).toFixed(1)}%`;
return "Clear result nahi mila";
}catch(err){ return "AI busy hai, 1 min baad try karo"; }
}
document.getElementById('analyze').onclick=async()=>{
if(!isPremium()){ alert(document.getElementById('lang').value==="hi"?"पहले प्रीमियम लो! ₹100":"Get Premium first! $4.99"); showPage('premium',document.querySelector('[data-page=premium]')); return; }
if(!document.getElementById('photo').files[0]) return alert("Photo daalo");
const btn=document.getElementById('analyze'); const old=btn.textContent; btn.textContent="AI Check ho raha hai..."; btn.disabled=true;
const aiText=await realAI(document.getElementById('photo').files[0]);
document.getElementById('result').innerHTML=`<div class="result"><b>${aiText}</b></div>`;
btn.textContent=old; btn.disabled=false;
};
document.getElementById('verifyPay').onclick=()=>{
const utr=document.getElementById('utr').value.trim();
if(utr.length < 2){ alert("Transaction ID daalo"); return; }
localStorage.setItem(CONFIG.PREMIUM_KEY,"true");
document.getElementById('payMsg').innerHTML="<div class='result'>✅ Premium Active! Ab check karo.</div>";
checkPremium();
};
// Owner simple PIN
document.getElementById('registerOwner').onclick=()=>{
const pin=document.getElementById('ownerPinSet').value; if(pin.length!=4){alert("4 digit PIN"); return;}
localStorage.setItem(CONFIG.PIN_KEY,pin);
document.getElementById('ownerMessage').innerHTML="<div class='result'>✅ Owner PIN set ho gaya: "+pin+"</div>";
};
document.getElementById('ownerLogin').onclick=()=>{
const pin=document.getElementById('ownerPinLogin').value;
if(pin===localStorage.getItem(CONFIG.PIN_KEY)){document.getElementById('adminPanel').innerHTML="<div class='result'><b>Owner Dashboard</b><br>Premium users: "+(isPremium()?"1 (You)":"0")+"</div>";}
else{alert("Galat PIN");}
};
</script>
</body>
</html>
